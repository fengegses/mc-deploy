# ============================================================
# 公共部署配置（可提交到 Git）
# 敏感值在 secrets.conf 中覆盖
# ============================================================
# 加载顺序：
#   1. 先定义所有公共默认值
#   2. 再 source secrets.conf（覆盖同名项）
#   3. secrets.conf 缺失时不报错，只警告，让调用方自行处理
# ============================================================

SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"

# ---------- 公共默认值 ----------
BASE_DIR="${MC_BASE_DIR:-/opt/minecraft}"

SERVICE_NAME="mc-server"
BACKUP_SERVICE="mc-backup"
LOG_CLEANUP_SERVICE="mc-log-cleanup"
CONTAINER_NAME="mc-server"

MC_PORT=25565
RCON_PORT=25575

MC_UID=1000
MC_GID=1000

MC_TYPE="PAPER"
MC_VERSION="26.2"
JAVA_VERSION="25"
MC_MEMORY="6G"

BACKUP_KEEP=14
BACKUP_MIN_SPACE_MB=2048
BACKUP_PIGZ_THREADS=4

TZ="Asia/Shanghai"

# ---------- 敏感配置（覆盖上面的默认值） ----------
SECRETS_FILE="$SCRIPT_DIR/secrets.conf"
SECRETS_LOADED=0

if [ -f "$SECRETS_FILE" ]; then
    # shellcheck disable=SC1091
    source "$SECRETS_FILE"
    SECRETS_LOADED=1
fi
